info:
  name: mcp
  type: folder
  seq: 1

request:
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: MCP-Protocol-Version
      value: 2026-07-28
  auth:
    type: apikey
    key: X-Redmine-API-Key
    value: "{{process.env.REDMINE_API_KEY}}"
    placement: header
  variables:
    - name: projectId
      value: test-project
    - name: targetUrl
      value: http://{{serverName}}:{{serverPort}}/projects/{{projectId}}/mcp
